name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (informational; builds the current ref)'
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package widget
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Tag annotations are not fetched by a shallow clone, and the release notes are
          # read from the annotation of the tag being built.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: microsoft/setup-msbuild@v3

      - name: Ensure UWP workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath) {
            exit 0
          }
          $path = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$path`"",
            '--add', 'Microsoft.VisualStudio.Workload.Universal',
            '--includeRecommended', '--quiet', '--norestart'
          )
          if ($p.ExitCode -ne 0) { throw "vs_installer exited $($p.ExitCode)" }

      - name: Test before packaging
        run: dotnet test tests/Discord.Rpc.Tests/Discord.Rpc.Tests.csproj -c Release

      # Decodes a base64 PFX from secrets when one is configured. Without it the package is
      # built unsigned, which is still useful as a build artifact but cannot be installed
      # by a normal user until it is signed.
      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "::warning::No SIGNING_CERTIFICATE_BASE64 secret; producing an UNSIGNED package."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Restore packaging project
        run: msbuild packaging/DiscordXboxWidget/DiscordXboxWidget.wapproj -t:Restore -p:Configuration=Release -p:Platform=x64

      # Release uses the .NET Native toolchain, which is the only configuration where the
      # runtime directives in Default.rd.xml matter. Packaging here is what exercises it.
      - name: Package (signed)
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: >
          msbuild packaging/DiscordXboxWidget/DiscordXboxWidget.wapproj
          -p:Configuration=Release -p:Platform=x64
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile=${{ steps.signing.outputs.pfx }}
          -p:PackageCertificatePassword=$env:CERT_PASSWORD

      - name: Package (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: >
          msbuild packaging/DiscordXboxWidget/DiscordXboxWidget.wapproj
          -p:Configuration=Release -p:Platform=x64
          -p:AppxPackageSigningEnabled=false

      - name: Collect package
        id: collect
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $test = Get-ChildItem packaging/DiscordXboxWidget/AppPackages -Directory |
            Where-Object { $_.Name -like '*_Test' } | Select-Object -First 1
          if (-not $test) { throw "No _Test output folder. Check the packaging step output." }

          $msix = @(Get-ChildItem $test.FullName -Filter *.msix)
          if ($msix.Count -ne 1) { throw "Expected one .msix, found $($msix.Count)." }

          # Framework dependencies are included deliberately: a machine without
          # Microsoft.NET.Native.Framework fails Add-AppxPackage with 0x80073CF3, and there
          # is no Store to resolve them from. Selected by architecture directory rather
          # than by filename -- the packaging project emits ARM, ARM64, x86 and x64
          # alongside each other, and this package is x64 only. Shipping the others would
          # imply support that does not exist.
          $deps = Join-Path $test.FullName 'Dependencies\x64'
          if (-not (Test-Path $deps)) { throw "No x64 dependency packages at $deps." }

          @($msix) + @(Get-ChildItem $deps -Filter *.appx) |
            ForEach-Object { Copy-Item $_.FullName $out }

          # Publish the public half of the signing certificate alongside the package.
          # Installing a self-signed MSIX requires trusting the certificate first, so a
          # release without it is not installable. Derived from the PFX rather than
          # committed, so the two can never drift apart.
          $pfx = '${{ steps.signing.outputs.pfx }}'
          if ($pfx -and (Test-Path $pfx)) {
            $pw = ConvertTo-SecureString '${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}' -AsPlainText -Force
            $cert = Get-PfxCertificate -FilePath $pfx -Password $pw
            [IO.File]::WriteAllBytes(
              (Join-Path $out 'DiscordXboxWidget.cer'),
              $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Write-Host "exported public certificate: $($cert.Subject)"
          } else {
            Write-Host "::warning::Unsigned build - no certificate to publish, package will not install."
          }

          Get-ChildItem $out | ForEach-Object { Write-Host "packaged: $($_.Name) ($($_.Length) bytes)" }

      - uses: actions/upload-artifact@v7
        with:
          name: DiscordXboxWidget-package
          path: artifacts/

      # Release notes come from the tag's own annotation, so they are written once, live in
      # git, and stay readable with `git show` rather than only on GitHub.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = git tag -l --format='%(contents)' $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Host "::warning::Tag has no annotation; falling back to install notes only."
            $notes = ''
          }

          # Boilerplate lives in its own file. Embedding markdown in a YAML block scalar
          # means any line at column zero silently ends the block and breaks the workflow.
          $install = Get-Content .github/release-install-notes.md -Raw

          $signing = if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            "`n_Signed. ``DiscordXboxWidget.cer`` below is the certificate to trust._`n"
          } else {
            "`n> **This build is unsigned** and cannot be installed until it is signed.`n"
          }

          Set-Content release-notes.md -Value ($notes + $install + $signing)
          Write-Host "--- release notes ---"
          Get-Content release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release-notes.md
