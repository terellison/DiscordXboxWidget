name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (informational; builds the current ref)'
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package widget
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Ensure UWP workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath) {
            exit 0
          }
          $path = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$path`"",
            '--add', 'Microsoft.VisualStudio.Workload.Universal',
            '--includeRecommended', '--quiet', '--norestart'
          )
          if ($p.ExitCode -ne 0) { throw "vs_installer exited $($p.ExitCode)" }

      - name: Test before packaging
        run: dotnet test tests/Discord.Rpc.Tests/Discord.Rpc.Tests.csproj -c Release

      - name: Build bridge
        run: dotnet build src/Discord.Rpc.Bridge/Discord.Rpc.Bridge.csproj -c Release

      # Decodes a base64 PFX from secrets when one is configured. Without it the package is
      # built unsigned, which is still useful as a build artifact but cannot be installed
      # by a normal user until it is signed.
      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "::warning::No SIGNING_CERTIFICATE_BASE64 secret; producing an UNSIGNED package."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Restore widget
        run: msbuild widget/DiscordWidget/DiscordWidget.csproj -t:Restore -p:Configuration=Release -p:Platform=x64

      # Release uses the .NET Native toolchain, which is the only configuration where the
      # runtime directives in Default.rd.xml matter. Packaging here is what exercises it.
      - name: Package (signed)
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: >
          msbuild widget/DiscordWidget/DiscordWidget.csproj
          -p:Configuration=Release -p:Platform=x64
          -p:AppxBundle=Never
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile=${{ steps.signing.outputs.pfx }}
          -p:PackageCertificatePassword=$env:CERT_PASSWORD

      - name: Package (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: >
          msbuild widget/DiscordWidget/DiscordWidget.csproj
          -p:Configuration=Release -p:Platform=x64
          -p:AppxBundle=Never
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false

      - name: Collect package
        id: collect
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $files = Get-ChildItem widget/DiscordWidget -Recurse -Include *.msix,*.appx,*.msixbundle,*.appxbundle `
            -ErrorAction SilentlyContinue
          if (-not $files) { throw "No package produced. Check the packaging step output." }

          $files | ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out | ForEach-Object { Write-Host "packaged: $($_.Name) ($($_.Length) bytes)" }

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordXboxWidget-package
          path: artifacts/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Sideload only. This widget cannot be distributed through the Microsoft Store:
            Discord restricts the `rpc` OAuth scope to the application owner plus its tester
            allowlist, and `runFullTrust` requires Store onboarding review.

            Requires the Discord desktop client running, and a Discord application with the
            `PUBLIC_OAUTH2_CLIENT` flag set.

            ${{ steps.signing.outputs.signed == 'true'
                && 'Signed with the configured certificate.'
                || '**Unsigned** - no signing certificate was configured, so this package cannot be installed until it is signed.' }}
