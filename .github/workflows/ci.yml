name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The library, bridge, harness and tests. Split from the widget because this half needs
  # nothing but the .NET SDK, so a UWP toolchain problem cannot mask a real test failure.
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # release.yml only runs on a version tag, so a syntax error in it is invisible until
      # release day — and manifests as a run with zero jobs and no logs. Parsing every
      # workflow here means a broken one fails on the commit that broke it.
      - name: Validate workflow YAML
        shell: pwsh
        run: |
          python -m pip install --quiet pyyaml
          $failed = $false
          Get-ChildItem .github/workflows -Filter *.yml | ForEach-Object {
            python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1],encoding='utf-8')); assert d.get('jobs'), 'no jobs'; print('ok ' + sys.argv[1])" $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "One or more workflow files are not valid YAML." }

      # The widget cannot be evaluated by the dotnet CLI at all (no WindowsXaml targets),
      # so the projects are named explicitly rather than restoring the solution.
      - name: Restore
        run: |
          dotnet restore src/Discord.Rpc/Discord.Rpc.csproj
          dotnet restore src/Discord.Rpc.Bridge/Discord.Rpc.Bridge.csproj
          dotnet restore src/Discord.Rpc.Harness/Discord.Rpc.Harness.csproj
          dotnet restore tests/Discord.Rpc.Tests/Discord.Rpc.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Discord.Rpc.Bridge/Discord.Rpc.Bridge.csproj -c Release --no-restore
          dotnet build src/Discord.Rpc.Harness/Discord.Rpc.Harness.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Discord.Rpc.Tests/Discord.Rpc.Tests.csproj
          -c Release --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

  # The UWP widget needs full MSBuild and the Universal Windows Platform workload. The
  # workload is not guaranteed to be present on the hosted image, so this job installs it
  # if missing rather than failing with a confusing "project could not be loaded".
  package:
    name: Build package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: microsoft/setup-msbuild@v3

      - name: Ensure UWP workload
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          if ($installed) {
            Write-Host "UWP workload already present at $installed"
            exit 0
          }

          Write-Host "UWP workload missing; installing."
          $path = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$path`"",
            '--add', 'Microsoft.VisualStudio.Workload.Universal',
            '--includeRecommended', '--quiet', '--norestart'
          )
          if ($p.ExitCode -ne 0) { throw "vs_installer exited $($p.ExitCode)" }

      # The packaging project builds the widget and the bridge itself, as project
      # references, so neither is built separately here.
      - name: Restore packaging project
        run: msbuild packaging/DiscordXboxWidget/DiscordXboxWidget.wapproj -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build packaging project
        run: msbuild packaging/DiscordXboxWidget/DiscordXboxWidget.wapproj -p:Configuration=Release -p:Platform=x64

      # The package is assembled from two independent halves, and losing either produces a
      # package that installs cleanly and does not work. Assert both are present, and that
      # the manifest's fullTrustProcess path still resolves to a file actually in the
      # package -- the packaging project derives that path from the bridge project's name,
      # so renaming the project would silently break the widget's only route to Discord.
      - name: Verify package contents
        shell: pwsh
        run: |
          $msix = @(Get-ChildItem packaging/DiscordXboxWidget/AppPackages -Recurse -Filter *.msix)
          if ($msix.Count -ne 1) { throw "Expected one .msix, found $($msix.Count)." }
          $msix = $msix[0]
          Write-Host "package: $($msix.Name) ($([math]::Round($msix.Length/1MB,1)) MB)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entries = $zip.Entries.FullName

            $manifest = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object IO.StreamReader($manifest.Open())
            [xml]$m = $reader.ReadToEnd()
            $reader.Dispose()

            $ns = @{
              d = 'http://schemas.microsoft.com/appx/manifest/desktop/windows10'
              f = 'http://schemas.microsoft.com/appx/manifest/foundation/windows10'
            }
            $ext = Select-Xml -Xml $m -Namespace $ns `
              -XPath "//d:Extension[@Category='windows.fullTrustProcess']"
            if (-not $ext) { throw "Manifest declares no windows.fullTrustProcess extension." }

            $declared = $ext.Node.Executable -replace '\\', '/'
            if ($entries -notcontains $declared) {
              throw "Manifest points fullTrustProcess at '$declared', which is not in the package."
            }
            Write-Host "bridge present at declared path: $declared"

            # The identity is what makes an install an upgrade instead of a second app.
            $id = Select-Xml -Xml $m -Namespace $ns -XPath '//f:Identity'
            if ($id.Node.Name -ne 'DiscordXboxWidget') {
              throw "Package identity changed to '$($id.Node.Name)'; this orphans existing installs."
            }
            Write-Host "identity: $($id.Node.Name) $($id.Node.Version)"

            if ($entries -notcontains 'DiscordWidget.exe') {
              throw "Widget executable missing from the package."
            }
          } finally {
            $zip.Dispose()
          }
